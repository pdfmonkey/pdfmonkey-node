name: Feature request
description: Suggest an enhancement to the SDK
title: "[feat]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the SDK does not currently support?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How could the SDK make this easier? Code samples welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you have tried, and why they fall short.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that would help us understand the request.
