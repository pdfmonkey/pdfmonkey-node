name: Bug report
description: Report a defect in the SDK
title: "[bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please make sure
        you are running the latest version before submitting.

  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      description: Output of `npm ls pdfmonkey` or the version in your package.json.
      placeholder: e.g. 1.2.3
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: e.g. v20.11.1
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Node.js
        - Bun
        - Deno
        - Cloudflare Workers
        - Vercel Edge
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behaviour you observed.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal code sample, command, or repository link.
      render: ts
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Stack trace or relevant log output (redact secrets).
      render: shell
